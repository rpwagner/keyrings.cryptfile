name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - "*"
  schedule:
    # Weekly on Sunday at 05:47 UTC.
    - cron: '47 5 * * 0'

permissions:
  contents: read

concurrency:
  # SHA is added to the end if on `main` to let all main workflows run.
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main') && github.sha || '' }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: keyrings/cryptfile/tests/requirements.txt
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . --requirement keyrings/cryptfile/tests/requirements.txt
          python -m pip check
      - name: Run complete test suite with coverage
        run: |
          python -m pytest -ra --cov-report=term-missing --pyargs keyrings.cryptfile.tests
